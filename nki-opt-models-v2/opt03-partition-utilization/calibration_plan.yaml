# Sweep plan for opt03. Each entry profiles a (before, after) pair.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage: vary TILE_P at M=1024,N=512 (3 points) plus 2 off-axis shapes.
# Both knobs (M, TILE_P_current) covered with ≥2 distinct values.

- kernel_id: add_M1024_N512_T16
  knobs: {M: 1024, N: 512, TILE_P_current: 16}
  before: sweep_kernels/add_M1024_N512_T16_before.py
  after:  sweep_kernels/add_M1024_N512_T16_after.py
  oracle: sweep_kernels/add_oracle.py

- kernel_id: add_M1024_N512_T32
