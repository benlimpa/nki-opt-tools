# Sweep plan for opt14. Each entry profiles a (single-buffered, double-buffered) pair.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage: vary n_tiles (M / TILE_M) and shape balance (DMA-vs-TensorE).
# 5 paired observations.

- kernel_id: mm_M1024_K128_N512
