# Sweep plan for opt35. Each entry profiles a (before, after) pair and appends
# rows to calibration.csv. To add a calibration point, drop a parameterized
# tanh-fused-scale-bias kernel + oracle into sweep_kernels/ and add an entry here.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage rule (per WORKFLOW_V2.md): at least 2 paired observations per knob.
# 3 calibrated knobs (broadcast_dim_N, fused_ops, num_outer_iters) → ≥6 pairs.

# --- Vary broadcast_dim_N (fused_ops=2, num_outer_iters=50) ----------------
- kernel_id: tanh_N128_ops2_iters50
  knobs: {broadcast_dim_N: 128, fused_ops: 2, num_outer_iters: 50}
  before: sweep_kernels/tanh_N128_ops2_iters50_before.py
  after:  sweep_kernels/tanh_N128_ops2_iters50_after.py
  oracle: sweep_kernels/tanh_oracle.py

- kernel_id: tanh_N256_ops2_iters50
  knobs: {broadcast_dim_N: 256, fused_ops: 2, num_outer_iters: 50}
  before: sweep_kernels/tanh_N256_ops2_iters50_before.py
  after:  sweep_kernels/tanh_N256_ops2_iters50_after.py
  oracle: sweep_kernels/tanh_oracle.py

- kernel_id: tanh_N512_ops2_iters50
  knobs: {broadcast_dim_N: 512, fused_ops: 2, num_outer_iters: 50}
  before: sweep_kernels/tanh_N512_ops2_iters50_before.py
  after:  sweep_kernels/tanh_N512_ops2_iters50_after.py
  oracle: sweep_kernels/tanh_oracle.py

# --- Off-axis: vary fused_ops ---------------------------------------------
- kernel_id: tanh_N256_ops1_iters50
  knobs: {broadcast_dim_N: 256, fused_ops: 1, num_outer_iters: 50}
  before: sweep_kernels/tanh_N256_ops1_iters50_before.py
  after:  sweep_kernels/tanh_N256_ops1_iters50_after.py
  oracle: sweep_kernels/tanh_oracle.py

# --- Off-axis: vary num_outer_iters ---------------------------------------
- kernel_id: tanh_N256_ops2_iters25
  knobs: {broadcast_dim_N: 256, fused_ops: 2, num_outer_iters: 25}
  before: sweep_kernels/tanh_N256_ops2_iters25_before.py
  after:  sweep_kernels/tanh_N256_ops2_iters25_after.py
  oracle: sweep_kernels/tanh_oracle.py

- kernel_id: tanh_N256_ops2_iters100
  knobs: {broadcast_dim_N: 256, fused_ops: 2, num_outer_iters: 100}
  before: sweep_kernels/tanh_N256_ops2_iters100_before.py
  after:  sweep_kernels/tanh_N256_ops2_iters100_after.py
  oracle: sweep_kernels/tanh_oracle.py
