# Sweep plan for opt06. Each entry profiles a (before, after) pair.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage: vary VALID_TILES at M=1024,N=512 (3 points) plus 2 off-axis shapes.
# Both knobs (total_tiles, valid_tiles) covered with ≥2 distinct values.

- kernel_id: scale_M1024_N512_T128_V4
  knobs: {M: 1024, N: 512, TILE_P: 128, total_tiles: 8, valid_tiles: 4}
  before: sweep_kernels/scale_M1024_N512_T128_V4_before.py
  after:  sweep_kernels/scale_M1024_N512_T128_V4_after.py
  oracle: sweep_kernels/scale_oracle.py

