# Sweep plan for opt18. Each entry profiles a (before, after) pair.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage: tile_k_ratio ∈ {2, 4, 8} on the v1 shape, plus 2 off-axis
# smaller-shape variants. 5 paired observations for the 4-param fit.

- kernel_id: mm_M1024_K512_N512_T16
  knobs: {K: 512, TILE_K_current: 16}
  before: sweep_kernels/mm_M1024_K512_N512_T16_before.py
  after:  sweep_kernels/mm_M1024_K512_N512_T16_after.py
  oracle: sweep_kernels/mm_oracle.py

