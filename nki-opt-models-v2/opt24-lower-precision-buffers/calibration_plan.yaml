# Sweep plan for opt24. Each entry profiles a (before, after) pair.
#
# Run:  python ../tools/run_calibration_sweep.py --plan calibration_plan.yaml
#
# Coverage: vary N (compute scale) at P=128 (3 points) plus 2 off-axis P/intermediates.

