# coverage_spec.toml — formalization of kernel-optimization-coverage.md
#
# One entry per modeled optimization (nki-opt-models-v2). Each entry turns the
# prose "Coverage Model" column into COUNTABLE bins, and records the correctness
# oracle + equivalence class + structural monitor decided in oracle-design.md.
#
# This file is the single source of truth for BOTH coverage counting and input
# generation. It contains no hardware dependency; spectra.py loads it offline.
#
# Per-opt fields:
#   name               human label
#   equivalence_class  A_bitexact | B_fp_reorder | C_precision   (oracle-design.md three classes)
#   oracle             torch_reference | before_after | torch_fp32_reference
#   oracle_anchor      (optional) secondary oracle run on a few shapes for shared-family bugs
#   tolerance          tight | depth_scaled | dtype_aware | "atol=..,rtol=.."
#   compare_region     full | valid_only         (opt06 computes only the valid region)
#   multi_core         true if any variant launches >1 LNC (affects launch, not oracle)
#   params             knob names (from the opt's Knobs dataclass)
#   structural_monitor profile counter that must move if the transform fired
#   structural_expected  drop_to_zero | decrease | increase | ratio
#   sample_params      real param dicts from sweep_kernels/ (used by offline partition tests)
#
# Each [[optNN.dimensions]] is one coverage axis:
#   name      axis label
#   source    sweep  (varied by existing sweep_kernels) | new (correctness axis we are ADDING)
#   buckets   inline tables {name, predicate, [critical=true]}
#             predicate is a Python expression over `params`; exactly one bucket
#             per dimension must match any valid param assignment (a partition).
#             critical=true marks a boundary/negative bin that is a CORRECTNESS
#             hazard (not merely a predictor precondition).

schema_version = 1

# ============================================================ opt01
[opt01]
name = "SBUF Accumulator"
equivalence_class = "A_bitexact"
oracle = "before_after"          # reduction: before/after share accumulation order -> atol~0
oracle_anchor = "torch_reference"  # accum_oracle.py: ref=sum of tiles, atol=1e-3
tolerance = "tight"
compare_region = "full"
multi_core = false
params = ["M", "TILE_M", "N"]
structural_monitor = "spill_save_bytes"
structural_expected = "drop_to_zero"
sample_params = [
  {M=512, TILE_M=128, N=512}, {M=1024, TILE_M=128, N=512},
  {M=1024, TILE_M=64, N=512}, {M=2048, TILE_M=128, N=512}, {M=1024, TILE_M=128, N=1024},
]
[[opt01.dimensions]]
name = "loop_count"
source = "sweep"
buckets = [
  {name = "single_loop", predicate = "M <= 2*TILE_M", critical = true},
  {name = "multi_loop",  predicate = "M >  2*TILE_M"},
]
[[opt01.dimensions]]
name = "accumulator_width"
source = "sweep"
buckets = [
  {name = "narrow", predicate = "N <= 512"},
  {name = "wide",   predicate = "N >  512"},
]

# ============================================================ opt03
[opt03]
name = "Full Partition Utilization"
equivalence_class = "A_bitexact"
oracle = "torch_reference"        # add_oracle.py: elementwise, atol=1e-5 (torch bit-exact)
tolerance = "atol=1e-5,rtol=1e-5"
compare_region = "full"
multi_core = false
params = ["M", "TILE_P_current"]
structural_monitor = "vector_instr_count"
structural_expected = "decrease"
sample_params = [
  {M=512, TILE_P_current=128}, {M=512, TILE_P_current=64},
  {M=1024, TILE_P_current=16}, {M=1024, TILE_P_current=32}, {M=1024, TILE_P_current=64},
]
[[opt03.dimensions]]
name = "partition_tile"
source = "sweep"
buckets = [
  {name = "p_le_16",  predicate = "TILE_P_current <= 16"},
  {name = "p_32",     predicate = "TILE_P_current == 32"},
  {name = "p_64",     predicate = "16 < TILE_P_current < 128 and TILE_P_current != 32"},
  {name = "p_128_noop", predicate = "TILE_P_current >= 128", critical = true},
]

# ============================================================ opt05
[opt05]
name = "Loop Fusion (2 loops)"
equivalence_class = "A_bitexact"
oracle = "torch_reference"        # fuse_oracle.py: ref=x passthrough, atol=1e-4
tolerance = "atol=1e-4,rtol=1e-4"
compare_region = "full"
multi_core = false
params = ["n_tiles", "n_intermediates"]
structural_monitor = "spill_save_bytes"
structural_expected = "drop_to_zero"
sample_params = [
  {n_tiles=4, n_intermediates=1}, {n_tiles=8, n_intermediates=1},
  {n_tiles=16, n_intermediates=1},
]
[[opt05.dimensions]]
name = "tile_count"
source = "sweep"
buckets = [
  {name = "few",  predicate = "n_tiles <= 4"},
  {name = "many", predicate = "n_tiles >  4"},
]

# ============================================================ opt06
[opt06]
name = "Skip Masked Compute"
equivalence_class = "A_bitexact"
oracle = "torch_reference"        # scale_oracle.py: ref compared on valid rows only, atol=1e-5
tolerance = "atol=1e-5,rtol=1e-5"
compare_region = "valid_only"
multi_core = false
params = ["total_tiles", "valid_tiles"]
structural_monitor = "vector_instr_count"
structural_expected = "ratio"     # drop by valid_tiles/total_tiles
sample_params = [
  {total_tiles=10, valid_tiles=1}, {total_tiles=10, valid_tiles=5},
  {total_tiles=10, valid_tiles=9}, {total_tiles=10, valid_tiles=10},
]
[[opt06.dimensions]]
name = "valid_ratio"
source = "sweep"
buckets = [
  {name = "sparse",   predicate = "valid_tiles*10 <= total_tiles*2"},   # <=20%
  {name = "half",     predicate = "total_tiles*2 < valid_tiles*10 < total_tiles*8"},
  {name = "dense",    predicate = "total_tiles*8 <= valid_tiles*10 < total_tiles*10"}, # 80-99%
  {name = "full_noop", predicate = "valid_tiles >= total_tiles", critical = true},
]

# ============================================================ opt07
[opt07]
name = "Loop Fusion (HBM intermediates)"
equivalence_class = "A_bitexact"
oracle = "torch_reference"        # pipe_oracle.py: ref=x, atol=1e-3
tolerance = "atol=1e-3,rtol=1e-3"
compare_region = "full"
multi_core = false
params = ["n_intermediates", "n_tiles"]
structural_monitor = "spill_save_bytes"
structural_expected = "drop_to_zero"
sample_params = [
  {n_intermediates=1, n_tiles=8}, {n_intermediates=2, n_tiles=8},
  {n_intermediates=3, n_tiles=8}, {n_intermediates=2, n_tiles=4},
]
[[opt07.dimensions]]
name = "intermediate_count"
source = "sweep"
buckets = [
  {name = "one",   predicate = "n_intermediates <= 1", critical = true},   # boundary == opt05
  {name = "two",   predicate = "n_intermediates == 2"},
  {name = "many",  predicate = "n_intermediates >= 3"},
]
[[opt07.dimensions]]
name = "tile_count"
source = "sweep"
buckets = [
  {name = "few",  predicate = "n_tiles <= 4"},
  {name = "many", predicate = "n_tiles >  4"},
]

