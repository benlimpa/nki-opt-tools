  {broadcast_dim_N=256, fused_ops=2, num_outer_iters=50},
  {broadcast_dim_N=256, fused_ops=1, num_outer_iters=50},
  {broadcast_dim_N=512, fused_ops=2, num_outer_iters=50},
  {broadcast_dim_N=256, fused_ops=2, num_outer_iters=100},
]
[[opt35.dimensions]]
name = "outer_iters"
source = "sweep"
buckets = [
  {name = "small", predicate = "num_outer_iters <= 50"},
  {name = "large", predicate = "num_outer_iters >  50"},
]
[[opt35.dimensions]]
name = "fused_ops"
source = "sweep"
buckets = [
  {name = "one", predicate = "fused_ops <= 1"},
  {name = "two", predicate = "fused_ops >= 2"},
]

