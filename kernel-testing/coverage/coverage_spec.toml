# ============================================================ opt38
[opt38]
name = "SPMD Launch Grid (Multi-Instance)"
equivalence_class = "A_bitexact"
oracle = "torch_reference"        # add_oracle.py: elementwise, atol=1e-5, FULL output
tolerance = "atol=1e-5,rtol=1e-5"
compare_region = "full"
multi_core = true                 # after launches kernel[G] with G>1 LNC
params = ["outer_loop_count", "target_grid_size", "saturation_pct"]
structural_monitor = "t_active_us"   # t_active/t_total saturation ratio
structural_expected = "ratio"
sample_params = [
  {outer_loop_count=16, target_grid_size=2, saturation_pct=50},
  {outer_loop_count=32, target_grid_size=2, saturation_pct=50},
  {outer_loop_count=32, target_grid_size=4, saturation_pct=50},
  {outer_loop_count=43, target_grid_size=2, saturation_pct=50},
]
[[opt38.dimensions]]
name = "shard_divisibility"
source = "new"
buckets = [
  {name = "divisible",  predicate = "outer_loop_count % target_grid_size == 0"},
  {name = "uneven_shard", predicate = "outer_loop_count % target_grid_size != 0", critical = true},
]
[[opt38.dimensions]]
name = "grid_size"
source = "sweep"
buckets = [
  {name = "g2", predicate = "target_grid_size == 2"},
  {name = "g4", predicate = "target_grid_size >= 4"},
]
[[opt38.dimensions]]
name = "saturation"
source = "sweep"
buckets = [
  {name = "idle",      predicate = "saturation_pct < 95"},
  {name = "saturated", predicate = "saturation_pct >= 95", critical = true},  # no speedup expected
]
