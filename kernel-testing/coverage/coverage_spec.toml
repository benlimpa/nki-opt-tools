# ============================================================ opt13
[opt13]
name = "Lower Input Precision"
equivalence_class = "C_precision"
oracle = "torch_fp32_reference"   # before takes fp32 inputs, after takes bf16 -> compare both vs fp32 ref
tolerance = "dtype_aware"
compare_region = "full"
multi_core = false
params = ["M", "K", "N", "dtype_ratio", "value_regime"]
structural_monitor = "hbm_read_bytes"
structural_expected = "ratio"     # ~ dtype_ratio
sample_params = [
  {M=512, K=512, N=256, dtype_ratio=0.5, value_regime="normal"},
  {M=1024, K=512, N=512, dtype_ratio=0.5, value_regime="normal"},
  {M=512, K=1024, N=512, dtype_ratio=0.5, value_regime="normal"},
]
[[opt13.dimensions]]
name = "precision"
source = "sweep"
buckets = [
  {name = "bf16", predicate = "dtype_ratio == 0.5"},
  {name = "int8", predicate = "dtype_ratio <= 0.25"},
]
[[opt13.dimensions]]
name = "value_regime"
source = "new"
buckets = [
  {name = "small",         predicate = "value_regime == 'small'"},
  {name = "normal",        predicate = "value_regime == 'normal'"},
  {name = "near_overflow", predicate = "value_regime == 'near_overflow'", critical = true},
]

# ============================================================ opt14
[opt14]
name = "Double Buffering"
equivalence_class = "A_bitexact"   # scheduling only; before/after bit-exact
oracle = "before_after"
oracle_anchor = "torch_reference"  # mm_oracle.py atol=1e-2
tolerance = "tight"
compare_region = "full"
multi_core = false
params = ["n_tiles", "bottleneck"]
structural_monitor = "t_active_us"
structural_expected = "increase"   # active-time fraction rises (overlap)
sample_params = [
  {n_tiles=4, bottleneck="dma"}, {n_tiles=8, bottleneck="dma"},
  {n_tiles=4, bottleneck="compute"},
]
[[opt14.dimensions]]
name = "tile_count"
source = "sweep"
buckets = [
  {name = "too_few", predicate = "n_tiles < 2", critical = true},  # nothing to overlap
  {name = "enough",  predicate = "n_tiles >= 2"},
]
[[opt14.dimensions]]
name = "bottleneck"
source = "new"
buckets = [
  {name = "dma_bound",     predicate = "bottleneck == 'dma'"},
  {name = "compute_bound", predicate = "bottleneck == 'compute'"},
]

