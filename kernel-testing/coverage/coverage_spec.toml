tolerance = "depth_scaled"
compare_region = "full"
multi_core = false
params = ["N_total"]
structural_monitor = "vector_instr_count"
structural_expected = "decrease"
sample_params = [ {N_total=4096}, {N_total=8192}, {N_total=16384}, {N_total=32768} ]
[[opt34.dimensions]]
name = "divisibility_128"
source = "new"
buckets = [
  {name = "divisible",  predicate = "N_total % 128 == 0"},
  {name = "remainder",  predicate = "N_total % 128 != 0", critical = true},
]
[[opt34.dimensions]]
name = "scan_size"
source = "sweep"
buckets = [
  {name = "small", predicate = "N_total <= 8192"},
  {name = "large", predicate = "N_total >  8192"},
]

# ============================================================ opt35
[opt35]
name = "Specialized / Fused Activation"
equivalence_class = "B_fp_reorder"
oracle = "torch_reference"        # tanh_oracle.py: ref=torch.tanh, atol=1e-3
tolerance = "atol=1e-3,rtol=1e-3"
